<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="60%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Left Side: Brand & Value Prop -->
  <g transform="translate(80, 75)">
    <!-- Brand Icon -->
    <rect width="64" height="64" rx="20" fill="#4F46E5" filter="url(#shadow)" />
    <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">☵</text>
    
    <!-- Title -->
    <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">tuck</text>
    <rect x="195" y="16" width="140" height="30" rx="15" fill="#6366F1" fill-opacity="0.25" stroke="#818CF8" stroke-width="1" />
    <text x="265" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">PERSONAL VAULT</text>

    <!-- Tagline & Description -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Your personal space for what matters most.</text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#C7D2FE">Identity cards &middot; Daily checklists &middot; Budgets &middot; Saved links</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#93C5FD">100% Offline-First PWA &middot; Supabase Cloud Sync &middot; Zero Unwanted Data</text>

    <!-- Badges -->
    <g transform="translate(0, 215)">
      <rect width="130" height="36" rx="18" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="1" />
      <text x="65" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">🔒 AES-256 Vault</text>

      <rect x="145" width="135" height="36" rx="18" fill="#6366F1" fill-opacity="0.25" stroke="#818CF8" stroke-width="1" />
      <text x="212" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C7D2FE" text-anchor="middle">⚡ Realtime Sync</text>

      <rect x="295" width="125" height="36" rx="18" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1" />
      <text x="357" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">📱 Install PWA</text>
    </g>
  </g>

  <!-- Right Side: Visual Cards Preview Mockup -->
  <g transform="translate(740, 50)" filter="url(#shadow)">
    <!-- Front Card: Identity Vault Preview -->
    <rect width="380" height="220" rx="20" fill="#1E1B4B" stroke="#4338CA" stroke-width="2" />
    <rect x="25" y="25" width="130" height="22" rx="11" fill="#4338CA" fill-opacity="0.5" />
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#C7D2FE" letter-spacing="1">PERSONAL IDENTITY</text>
    
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Aadhaar Card</text>
    <text x="25" y="112" font-family="monospace" font-size="18" font-weight="700" fill="#A5B4FC" letter-spacing="2">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4821</text>
    
    <rect x="25" y="145" width="140" height="32" rx="10" fill="#4338CA" />
    <text x="95" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reveal with PIN</text>

    <circle cx="320" cy="55" r="24" fill="#312E81" stroke="#4F46E5" stroke-width="2" />
    <text x="320" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle">🛡️</text>

    <!-- Overlapping Mini Task Card -->
    <g transform="translate(60, 150)">
      <rect width="340" height="150" rx="18" fill="#FFFFFF" filter="url(#shadow)" />
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Today's Priorities</text>
      
      <!-- Task 1 -->
      <circle cx="30" cy="62" r="8" fill="#10B981" />
      <text x="48" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E293B">Renew Car Insurance</text>
      <rect x="240" y="52" width="55" height="20" rx="10" fill="#FEF2F2" />
      <text x="267" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle">High</text>

      <!-- Task 2 -->
      <circle cx="30" cy="98" r="8" fill="#CBD5E1" />
      <text x="48" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748B">Review monthly budget</text>
      <rect x="240" y="88" width="65" height="20" rx="10" fill="#FFFBEB" />
      <text x="272" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Medium</text>
      
      <!-- Progress Bar -->
      <rect x="20" y="130" width="300" height="6" rx="3" fill="#E2E8F0" />
      <rect x="20" y="130" width="180" height="6" rx="3" fill="#4338CA" />
    </g>
  </g>
</svg>
